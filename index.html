});

  exitToMainHub();
  recenterVR();

function markHeadsetOffOrPaused() {
  resetToMainHub();
}

function onHeadsetVisibilityChange(event) {
  const st = event?.session?.visibilityState || renderer.xr.getSession()?.visibilityState;
  if (st === 'hidden' || st === 'visible' || st === 'visible-blurred') {
    markHeadsetOffOrPaused();
  }
}

function onDocumentVisibilityChange() {
  if (document.visibilityState === 'visible' || document.visibilityState === 'hidden') {
    markHeadsetOffOrPaused();
  }
}

function attachHeadsetVisibilityHandler() {
  const session = renderer.xr.getSession();
  if (!session || headsetVisibilityHandlerAttached) return;
  session.addEventListener('visibilitychange', onHeadsetVisibilityChange);
  document.addEventListener('visibilitychange', onDocumentVisibilityChange);
  headsetVisibilityHandlerAttached = true;
}

function detachHeadsetVisibilityHandler() {
  const session = renderer.xr.getSession();
  if (session) {
    session.removeEventListener('visibilitychange', onHeadsetVisibilityChange);
  }
  document.removeEventListener('visibilitychange', onDocumentVisibilityChange);
  headsetVisibilityHandlerAttached = false;
}

function createDarkPlaceholderTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0a0d';
  ctx.fillRect(0, 0, 128, 128);
  ctx.strokeStyle = 'rgba(244, 162, 97, 0.3)';
  ctx.lineWidth = 4;
  ctx.strokeRect(4, 4, 120, 120);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const defaultPlaceholderTex = createDarkPlaceholderTexture();

function loadFastTexture(url) {
  if (textureCache.has(url)) {
    return Promise.resolve(textureCache.get(url));
  }

  return new Promise((resolve) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.decoding = 'async';
    
    img.onload = () => {
      const tex = new THREE.Texture(img);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.generateMipmaps = false;
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.needsUpdate = true;
      
      const aspect = (img.naturalWidth && img.naturalHeight) ? (img.naturalHeight / img.naturalWidth) : 0.75;
      const result = { texture: tex, aspect };
      textureCache.set(url, result);
      resolve(result);
    };

    img.onerror = () => {
      resolve({ texture: defaultPlaceholderTex, aspect: 0.75 });
    };

    img.src = url;
  });
}

function clearGroup(g) {
  while (g.children.length) {
    const c = g.children[0];
    g.remove(c);
    c.geometry?.dispose();
    if (c.material) {
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach(m => {
        if (m.map && m.map !== defaultPlaceholderTex) m.map.dispose();
        m.dispose();
      });
    }
  }
}

function createDarkGlowTexture(text) {
  const c = document.createElement('canvas');
  c.width = 512;
  c.height = 256;
  const ctx = c.getContext('2d');

  ctx.clearRect(0, 0, c.width, c.height);

  const margin = 24;
  const x = margin;
  const y = margin;
  const w = c.width - margin * 2;
  const h = c.height - margin * 2;
  const radius = 20;

  ctx.save();
  ctx.shadowColor = 'rgba(244, 162, 97, 0.5)';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#0a0a0d';
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fill();
  ctx.restore();

  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, '#121216');
  grad.addColorStop(0.5, '#070709');
  grad.addColorStop(1, '#020203');

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.fill();

  ctx.strokeStyle = 'rgba(244, 162, 97, 0.8)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, radius);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(x + radius, y + 2);
  ctx.lineTo(x + w - radius, y + 2);
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 36px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
  ctx.shadowBlur = 8;
  ctx.fillText(text, c.width / 2, c.height / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.generateMipmaps = false;
  tex.minFilter = THREE.LinearFilter;
  return tex;
}

const mainHubGroup = new THREE.Group();
scene.add(mainHubGroup);

function recenterMainHubAroundUser() {
  camera.getWorldPosition(_cam);
  camera.getWorldDirection(_fwd);
  _fwd.y = 0;
  _fwd.normalize();

  mainHubGroup.position.set(_cam.x, 0, _cam.z);
  
  if (_fwd.lengthSq() > 0) {
    const angle = Math.atan2(_fwd.x, _fwd.z);
    mainHubGroup.rotation.y = angle - Math.PI;
  }
}

const mainPanels = [];
const MAIN_RADIUS = 2.8;
const IMAGE_Y = 1.2;

function createMainHubPanels() {
  clearGroup(mainHubGroup);
  mainPanels.length = 0;

  for (let i = 0; i < hubItems.length; i++) {
    const angle = (i / hubItems.length) * Math.PI * 2;
    const x = Math.sin(angle) * MAIN_RADIUS;
    const z = -Math.cos(angle) * MAIN_RADIUS;
    const item = hubItems[i];

    const mat = new THREE.MeshBasicMaterial({ 
      map: defaultPlaceholderTex,
      transparent: true, 
      side: THREE.DoubleSide
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.9), mat);
    mesh.position.set(x, IMAGE_Y, z);
    mesh.lookAt(0, IMAGE_Y, 0);
    mainHubGroup.add(mesh);

    loadFastTexture(item.img).then(({ texture, aspect }) => {
      mesh.material.map = texture;
      mesh.material.needsUpdate = true;
      const w = 0.9;
      const h = w * aspect;
      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(w, h);
    });

    mainPanels.push({ mesh, item, index: i, prog: 0 });
  }
}

createMainHubPanels();

const roomGroup = new THREE.Group();
roomGroup.visible = false;
scene.add(roomGroup);

const carouselGroup = new THREE.Group();
carouselGroup.visible = false;
scene.add(carouselGroup);

let carouselItems = [];
const CAROUSEL_RADIUS = 3.2;

const virtualBackGroup = new THREE.Group();
scene.add(virtualBackGroup);

function createVirtualBackButton() {
  clearGroup(virtualBackGroup);
  const tex = createDarkGlowTexture('⬅ TORNAR ENRERE');
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.8), mat);
  mesh.position.set(0, 0.3, -1.8);
  virtualBackGroup.add(mesh);
}

function updateBackButtonVisibility() {
  const btn = document.getElementById('backButton');
  if (state === 'mainHub') {
    btn.style.display = 'none';
    virtualBackGroup.visible = false;
  } else {
    btn.style.display = 'block';
    createVirtualBackButton();
    virtualBackGroup.visible = true;
  }
}

// Retrocés unificat
window.triggerBackAction = function() {
  const isDirectRoom = currentSelectedCompany === 'roquet' || currentSelectedCompany === 'america';
  if (state === 'carousel') {
    if (isDirectRoom) {
      exitToMainHub();
    } else {
      closeCarousel();
    }
  } else if (state === 'themeRoom') {
    exitToMainHub();
  }
  updateBackButtonVisibility();
};

function buildThemeRoom(companyId) {
  currentSelectedCompany = companyId;
  clearGroup(roomGroup);
  closeCarousel();
  roomLabels.length = 0; 

  camera.getWorldPosition(_cam);
  camera.getWorldDirection(_fwd);
  _fwd.y = 0;
  _fwd.normalize();

  roomGroup.position.set(_cam.x, 0, _cam.z);

  if (_fwd.lengthSq() > 0) {
    const lookAngle = Math.atan2(_fwd.x, _fwd.z);
    roomGroup.rotation.y = lookAngle - Math.PI;
  } else {
    roomGroup.rotation.y = 0;
  }

  mainHubGroup.visible = false;

  // Si és Roquet o Amèrica (galeria única), obrim directament el carrusel
  if (companyId === 'roquet' || companyId === 'america') {
    openCarouselCategory('Galeria');
    return;
  }

  const categoryConfig = [
    { key: 'Producte', angle: 0 },
    { key: 'Edifici', angle: -Math.PI / 3 },
    { key: 'Instalacions', angle: Math.PI / 3 }
  ];

  const RL_RADIUS = 2.5;
  const RL_Y = 1.2;

  for (let i = 0; i < categoryConfig.length; i++) {
    const config = categoryConfig[i];
    const lx = Math.sin(config.angle) * RL_RADIUS;
    const lz = -Math.cos(config.angle) * RL_RADIUS;

    const ltex = createDarkGlowTexture(config.key);
    const lmat = new THREE.MeshBasicMaterial({ 
      map: ltex, 
      transparent: true, 
      side: THREE.DoubleSide,
      opacity: 0.85
    });

    const lmesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.7), lmat);
    lmesh.position.set(lx, RL_Y, lz);
    lmesh.lookAt(0, RL_Y, 0);
    
    roomGroup.add(lmesh);
    roomLabels.push({ mesh: lmesh, index: i, categoryKey: config.key, prog: 0 });
  }

  roomGroup.visible = true;
  state = 'themeRoom';
  updateBackButtonVisibility();
}

function openCarouselCategory(categoryKey) {
  clearGroup(carouselGroup);
  carouselItems = [];
  carouselGroup.rotation.y = 0; 

  mainHubGroup.visible = false;
  roomGroup.visible = false;

  const companyData = companyGalleries[currentSelectedCompany];
  const imageList = (companyData && companyData[categoryKey]) ? companyData[categoryKey] : [];
  
  if (imageList.length === 0) return;

  camera.getWorldPosition(_cam);
  carouselGroup.position.set(_cam.x, 0, _cam.z);

  const count = imageList.length;

  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const basePos = new THREE.Vector3(
      Math.sin(angle) * CAROUSEL_RADIUS,
      1.2,
      -Math.cos(angle) * CAROUSEL_RADIUS
    );

    const mat = new THREE.MeshBasicMaterial({ 
      map: defaultPlaceholderTex,
      side: THREE.DoubleSide, 
      transparent: true,
      opacity: 0.95
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.9), mat);
    mesh.position.copy(basePos);
    mesh.lookAt(0, 1.2, 0);
    carouselGroup.add(mesh);

    loadFastTexture(imageList[i]).then(({ texture, aspect }) => {
      mesh.material.map = texture;
      mesh.material.needsUpdate = true;
      const w = 1.2;
      const h = w * aspect;
      mesh.geometry.dispose();
      mesh.geometry = new THREE.PlaneGeometry(w, h);
    });

    carouselItems.push({
      mesh,
      basePos: basePos.clone(),
      prog: 0
    });
  }

  carouselGroup.visible = true;
  state = 'carousel';
  updateBackButtonVisibility();
}

function closeCarousel() {
  clearGroup(carouselGroup);
  carouselGroup.visible = false;
  carouselItems = [];
  lastLookedCarousel = -1;
  const isDirectRoom = currentSelectedCompany === 'roquet' || currentSelectedCompany === 'america';
  if (state === 'carousel') {
    if (isDirectRoom) {
      exitToMainHub();
    } else {
      roomGroup.visible = true;
      state = 'themeRoom';
    }
  }
  updateBackButtonVisibility();
}

function exitToMainHub() {
  closeCarousel();
  clearGroup(roomGroup);
  roomGroup.visible = false;
  mainHubGroup.visible = true;
  currentSelectedCompany = null;
  state = 'mainHub';
  lastLookedMain = -1;
  lastLookedRoom = -1;
  lastLookedCarousel = -1;
  updateBackButtonVisibility();
}

function getLookedMainPanel() {
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.72;
  
  for (let i = 0; i < mainPanels.length; i++) {
    if (!mainPanels[i].mesh.visible) continue;
    mainPanels[i].mesh.getWorldPosition(_itemWorldPos);
    _to.copy(_itemWorldPos).sub(_cam).normalize();
    let d = _fwd.dot(_to);
    if (i === lastLookedMain) d += 0.04;
    if (d > bestDot) { bestDot = d; best = i; }
  }
  lastLookedMain = best;
  return best;
}

function getLookedRoomLabel() {
  if (state !== 'themeRoom') return -1;
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.7;
  
  for (let i = 0; i < roomLabels.length; i++) {
    roomLabels[i].mesh.getWorldPosition(_itemWorldPos);
    _to.copy(_itemWorldPos).sub(_cam).normalize();
    let d = _fwd.dot(_to);
    if (i === lastLookedRoom) d += 0.04;
    if (d > bestDot) { bestDot = d; best = i; }
  }
  lastLookedRoom = best;
  return best;
}

function getLookedCarouselItem() {
  if (state !== 'carousel') return -1;
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  let best = -1, bestDot = 0.75;
  
  for (let i = 0; i < carouselItems.length; i++) {
    carouselItems[i].mesh.getWorldPosition(_itemWorldPos);
    _to.copy(_itemWorldPos).sub(_cam).normalize();
    let d = _fwd.dot(_to);
    if (i === lastLookedCarousel) d += 0.06;
    if (d > bestDot) { bestDot = d; best = i; }
  }
  lastLookedCarousel = best;
  return best;
}

function checkLookedVirtualBack() {
  if (state === 'mainHub') return false;
  camera.getWorldDirection(_fwd);
  camera.getWorldPosition(_cam);
  const backPos = new THREE.Vector3(0, 0.3, -1.8).add(cameraGroup.position);
  _to.copy(backPos).sub(_cam).normalize();
  return _fwd.dot(_to) > 0.85;
}

const statusEl = document.getElementById('status');

if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-ar').then(supported => {
    if (supported) {
      statusEl.textContent = 'Llest! Prem el botó "START AR" per començar.';
      document.body.appendChild(ARButton.createButton(renderer, { optionalFeatures: ['local-floor', 'bounded-floor'] }));
    } else {
      statusEl.textContent = 'Mode AR no disponible en aquest dispositiu.';
    }
  }).catch(() => {
    statusEl.textContent = 'Llest! (Mode estàndard actiu)';
  });
} else {
  statusEl.textContent = 'WebXR no compatible en aquest navegador.';
  const fallbackBtn = document.createElement('button');
  fallbackBtn.textContent = 'ENTRAR (Mòdul web)';
  fallbackBtn.id = 'ARButton';
  fallbackBtn.onclick = () => { document.getElementById('overlay').style.display = 'none'; };
  document.body.appendChild(fallbackBtn);
}

setTimeout(() => {
  if (statusEl.textContent.includes('Iniciant')) {
    statusEl.textContent = 'Llest! Entorn preparat.';
  }
}, 2000);

const infoEl = document.getElementById('controllerInfo');

function handleInput(delta, frame) {
  const session = renderer.xr.getSession(); if (!session) return;
  const refSpace = renderer.xr.getReferenceSpace(); let anyController = false;

  for (const src of session.inputSources) {
    if (!src.gamepad) continue;
    if (frame && refSpace) {
      const space = src.gripSpace || src.targetRaySpace;
      if (space) {
        const pose = frame.getPose(space, refSpace);
        if (pose) { anyController = true; }
      }
    }

    const handedness = src.handedness; 
    if (handedness !== 'left' && handedness !== 'right') continue;

    const gp = src.gamepad; 
    const bState = buttonStates[handedness];

    let selectPressed = gp.buttons[4]?.pressed || gp.buttons[0]?.pressed || gp.buttons[3]?.pressed;
    let backPressed = gp.buttons[5]?.pressed || gp.buttons[1]?.pressed || gp.buttons[2]?.pressed;

    if (checkLookedVirtualBack()) {
      for (let i = 0; i < gp.buttons.length; i++) {
        if (gp.buttons[i].pressed) backPressed = true;
      }
    }

    for (let i = 0; i < gp.buttons.length; i++) {
      if (gp.buttons[i].pressed && !bState.prevButtons[i]) {
        if (i === 0 || i === 4) selectPressed = true;
        if (i === 1 || i === 5 || i === 2 || i === 3) backPressed = true;
      }
      bState.prevButtons[i] = gp.buttons[i].pressed;
    }

    const axisX = gp.axes[2] !== undefined ? gp.axes[2] : gp.axes[0];
    if (axisX !== undefined) {
      const deadzone = 0.15;
      if (Math.abs(axisX) > deadzone) {
        const sign = Math.sign(axisX);
        const normalizedInput = (Math.abs(axisX) - deadzone) / (1.0 - deadzone);
        const maxTurnSpeed = 1.5; 

        if (state === 'carousel' && carouselGroup.visible) {
          carouselGroup.rotation.y -= sign * normalizedInput * maxTurnSpeed * delta;
        } else {
          cameraGroup.rotation.y -= sign * normalizedInput * maxTurnSpeed * delta;
        }
      }
    }

    if (selectPressed && !bState.select) {
      if (state === 'mainHub') {
        const idx = getLookedMainPanel();
        if (idx !== -1) {
          buildThemeRoom(hubItems[idx].id);
        }
      } else if (state === 'themeRoom') {
        const ridx = getLookedRoomLabel();
        if (ridx !== -1) {
          openCarouselCategory(roomLabels[ridx].categoryKey);
        }
      } else if (state === 'carousel' && checkLookedVirtualBack()) {
        triggerBackAction();
      }
    }

    if (backPressed && !bState.back) {
      triggerBackAction();
    }

    bState.select = selectPressed; 
    bState.back = backPressed;
  }
  if(infoEl) infoEl.textContent = anyController ? 'Mandos actius' : 'Mandos: buscant...';
}

let lastClockTime = performance.now();

function animate(time, frame) {
  const now = performance.now();
  const delta = Math.min((now - lastClockTime) / 1000, 0.1); 
  lastClockTime = now;

  if (pendingHubRecenter && renderer.xr.getSession() && frame) { 
    recenterVR(); 
    pendingHubRecenter = false; 
  }

  camera.getWorldPosition(_camPos2D);

  if (state === 'mainHub') {
    const looked = getLookedMainPanel();
    for (let i = 0; i < mainPanels.length; i++) {
      const p = mainPanels[i];
      if (!p.mesh.visible) continue;
      const target = (i === looked) ? 1 : 0;
      p.prog += (target - p.prog) * 0.12;
      p.mesh.scale.setScalar(1 + 0.18 * p.prog);
      const camPos3 = new THREE.Vector3(); 
      camera.getWorldPosition(camPos3); 
      p.mesh.lookAt(camPos3.x, camPos3.y - 0.1, camPos3.z);
    }
  } else if (state === 'themeRoom') {
    const looked = getLookedRoomLabel();
    for (let i = 0; i < roomLabels.length; i++) {
      const r = roomLabels[i]; 
      const target = (i === looked) ? 1 : 0; 
      r.prog += (target - r.prog) * 0.12;
      r.mesh.scale.setScalar(1 + 0.25 * r.prog);
      r.mesh.material.opacity = 0.75 + 0.25 * r.prog;
      r.mesh.lookAt(_camPos2D.x, r.mesh.position.y, _camPos2D.z);
    }
  } else if (state === 'carousel' && carouselGroup.visible) {
    const lookedIdx = getLookedCarouselItem();
    for (let i = 0; i < carouselItems.length; i++) {
      const item = carouselItems[i];
      const target = (i === lookedIdx) ? 1 : 0;
      
      item.prog += (target - item.prog) * 0.12;
      item.mesh.scale.setScalar(1 + 0.65 * item.prog);

      const moveDir = item.basePos.clone().normalize();
      const targetPos = item.basePos.clone().sub(moveDir.multiplyScalar(1.0 * item.prog));
      item.mesh.position.copy(targetPos);
    }
  }

  if (virtualBackGroup.visible) {
    virtualBackGroup.position.copy(cameraGroup.position);
    virtualBackGroup.rotation.y = cameraGroup.rotation.y;
  }

  handleInput(delta, frame);
  renderer.render(scene, camera);
}

renderer.setAnimationLoop((time, frame) => { animate(time, frame); });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
